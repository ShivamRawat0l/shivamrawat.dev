<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Shivam Rawat — React Native & iOS Engineer</title>
		<meta
			name="description"
			content="Shivam Rawat is a React Native and iOS engineer building fast, reliable mobile products — server-driven UI, real-time messaging and video, and reusable native modules."
		/>
		<meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#131110" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="profile.webp" />

		<meta property="og:type" content="website" />
		<meta property="og:title" content="Shivam Rawat — React Native & iOS Engineer" />
		<meta
			property="og:description"
			content="Mobile engineer shipping React Native and iOS products: server-driven UI, real-time features and native modules."
		/>
		<meta property="og:url" content="https://shivamrawat.dev" />
		<meta name="twitter:card" content="summary" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>

		<!-- Applied before paint so the saved/system theme doesn't flash. -->
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('theme');
					var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				} catch (e) {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
